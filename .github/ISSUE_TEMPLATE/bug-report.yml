name: Bug report
description: Report a reproducible issue in Tabs to txt.
body:
  - type: markdown
    attributes:
      value: Reports are public. Examples should contain non-sensitive URLs. Privacy inquiries can be sent to contato.tabstotxt@midnorth.com.br.
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and extension version
      placeholder: Edge on Windows, extension 2.0.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual and expected behavior
    validations:
      required: true
