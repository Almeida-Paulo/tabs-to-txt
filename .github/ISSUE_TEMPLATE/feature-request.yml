name: Feature request
description: Propose an improvement to Tabs to txt.
body:
  - type: markdown
    attributes:
      value: Feature requests are public. Examples should contain non-sensitive URLs.
  - type: textarea
    id: context
    attributes:
      label: Use case
      description: Current tab management workflow and the problem to address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Edge on Windows
